apiVersion: apps/v1
kind: Deployment
metadata:
  name: upload-service
  namespace: forkcast
spec:
  replicas: 2
  selector:
    matchLabels:
      app: upload-service
  template:
    metadata:
      labels:
        app: upload-service
    spec:
      containers:
        - name: upload-service
          image: forkcast/upload-service:latest # You'll need to build and push this image
          ports:
            - containerPort: 3006
          env:
            - name: PORT
              value: "3006"
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: forkcast-config
                  key: NODE_ENV
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: forkcast-config
                  key: FRONTEND_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: forkcast-secrets
                  key: JWT_SECRET
            - name: JWT_EXPIRES_IN
              valueFrom:
                configMapKeyRef:
                  name: forkcast-config
                  key: JWT_EXPIRES_IN
          volumeMounts:
            - name: upload-storage
              mountPath: /app/uploads
          livenessProbe:
            httpGet:
              path: /health
              port: 3006
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3006
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: upload-storage
          persistentVolumeClaim:
            claimName: upload-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: upload-service
  namespace: forkcast
spec:
  selector:
    app: upload-service
  ports:
    - port: 3006
      targetPort: 3006
  type: ClusterIP
