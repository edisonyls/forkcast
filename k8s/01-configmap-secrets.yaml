apiVersion: v1
kind: ConfigMap
metadata:
  name: forkcast-config
  namespace: forkcast
data:
  NODE_ENV: "production"
  JWT_EXPIRES_IN: "7d"
  POSTGRES_DB: "forkcast"
  POSTGRES_USER: "postgres"
  # Service URLs for internal communication
  MENU_SERVICE_URL: "http://menu-service:3002"
  ORDER_SERVICE_URL: "http://order-service:3003"
  SEARCH_SERVICE_URL: "http://search-service:3004"
  NOTIFICATION_SERVICE_URL: "http://notification-service:3005"
  UPLOAD_SERVICE_URL: "http://upload-service:3006"
  REDIS_URL: "redis://redis:6379"
  FRONTEND_URL: "https://forkcast.edisonyls.com"
  # SMTP Configuration (update these with your actual values)
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_USER: "your-email@gmail.com"
---
apiVersion: v1
kind: Secret
metadata:
  name: forkcast-secrets
  namespace: forkcast
type: Opaque
data:
  # Base64 encoded values - you need to replace these with your actual secrets
  # To encode: echo -n "your-secret" | base64
  POSTGRES_PASSWORD: cG9zdGdyZXM= # 'postgres' - change this in production
  JWT_SECRET: MzhlOTdhZDFjNWZmMmI4Y2EzMTgyNTkzZDZlMzMxNmE5NTEzNjQ0NDgwZThiZDJjZDQzZTNhYjRiNzkwOWMxMg== # change this
  SMTP_PASS: eW91ci1hcHAtcGFzc3dvcmQ= # your SMTP password - change this
