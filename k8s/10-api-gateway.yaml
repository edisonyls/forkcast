apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: forkcast
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: forkcast/api-gateway:latest  # You'll need to build and push this image
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: forkcast-config
              key: NODE_ENV
        - name: MENU_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: forkcast-config
              key: MENU_SERVICE_URL
        - name: ORDER_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: forkcast-config
              key: ORDER_SERVICE_URL
        - name: SEARCH_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: forkcast-config
              key: SEARCH_SERVICE_URL
        - name: NOTIFICATION_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: forkcast-config
              key: NOTIFICATION_SERVICE_URL
        - name: UPLOAD_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: forkcast-config
              key: UPLOAD_SERVICE_URL
        - name: FRONTEND_URL
          valueFrom:
            configMapKeyRef:
              name: forkcast-config
              key: FRONTEND_URL
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: forkcast
spec:
  selector:
    app: api-gateway
  ports:
  - port: 3000
    targetPort: 3000
  type: ClusterIP
