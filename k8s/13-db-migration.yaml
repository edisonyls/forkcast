apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration
  namespace: forkcast
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-migration
          image: edisonyls/forkcast-menu-service:latest # Using menu service image as it has Prisma
          command: ["/bin/sh"]
          args:
            - -c
            - |
              cd /app/shared
              echo "Waiting for database to be ready..."
              until node -e "
                const net = require('net');
                const client = new net.Socket();
                client.connect(5432, 'postgres', () => {
                  console.log('Database is ready');
                  client.destroy();
                  process.exit(0);
                });
                client.on('error', () => {
                  client.destroy();
                  process.exit(1);
                });
              " 2>/dev/null; do
                echo "Waiting for database..."
                sleep 2
              done
              echo "Database is ready, pushing schema..."
              npx prisma db push --accept-data-loss
              echo "Generating Prisma client..."
              npx prisma generate
              echo "Database schema setup complete! Ready for user registration."
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: forkcast-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://postgres:$(POSTGRES_PASSWORD)@postgres:5432/forkcast"
