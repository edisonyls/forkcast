name: Local Kubernetes Deploy

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "k8s/**"
      - ".github/workflows/local-k8s-deploy.yml"

jobs:
  deploy-to-local-k8s:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VM Kubernetes Cluster
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          password: ${{ secrets.VM_PASSWORD }}
          port: ${{ secrets.VM_PORT }}
          script: |
            echo "🚀 Starting Kubernetes deployment on VM..."

            # Navigate to project directory (under home directory)
            cd ~/forkcast

            # Pull latest changes with better error handling
            echo "📥 Pulling latest code..."
            if git pull origin main; then
              echo "✅ Code updated successfully"
            else
              echo "⚠️ Git pull failed - using existing code"
              echo "💡 Check: git config --global credential.helper store"
              echo "💡 Or ensure SSH key is set up for GitHub"
            fi

            # Check Docker permissions and set command
            echo "🔧 Checking Docker permissions..."
            if docker info >/dev/null 2>&1; then
              echo "✅ Docker access working"
              DOCKER_CMD="docker"
            else
              echo "❌ Docker permission denied"
              if groups $USER | grep -q docker; then
                echo "💡 User is in docker group but needs to logout/login"
                echo "Using sudo for now..."
                DOCKER_CMD="sudo docker"
              else
                echo "💡 User not in docker group - run: sudo usermod -aG docker $USER"
                echo "💡 Then logout and login"
                echo "Using sudo for now..."
                DOCKER_CMD="sudo docker"
              fi
            fi

            # Build images locally using the dedicated local build script
            echo "🔨 Building Docker images locally (no registry push needed)..."
            cd k8s
            chmod +x build-images-local.sh
            ./build-images-local.sh
            echo "📝 Preparing Kubernetes manifests for local deployment..."

            # Create a backup of original manifests
            for file in *.yaml; do
              if [[ ! -f "${file}.backup" ]]; then
                cp "$file" "${file}.backup"
              fi
            done

            # Update image pull policy to Never (use local images only)
            sed -i 's/imagePullPolicy: Always/imagePullPolicy: Never/g' *.yaml 2>/dev/null || true

            # Ensure we're using local image names (remove registry prefix)
            sed -i 's|edisonyls/forkcast-|forkcast-|g' *.yaml

            # Make deploy script executable and run it
            echo "🚢 Deploying using k8s/deploy.sh script..."
            chmod +x deploy.sh

            # Run deployment script in automated mode (skip interactive prompts)
            export IMAGES_READY=y
            ./deploy.sh

            # Force rolling update to pick up new local images
            echo "🔄 Forcing rolling update to use newly built local images..."
            kubectl rollout restart deployment/menu-service -n forkcast
            kubectl rollout restart deployment/order-service -n forkcast
            kubectl rollout restart deployment/search-service -n forkcast
            kubectl rollout restart deployment/notification-service -n forkcast
            kubectl rollout restart deployment/upload-service -n forkcast
            kubectl rollout restart deployment/api-gateway -n forkcast

            # Wait for rollout to complete
            echo "⏳ Waiting for rolling update to complete..."
            kubectl rollout status deployment/menu-service -n forkcast --timeout=300s
            kubectl rollout status deployment/order-service -n forkcast --timeout=300s
            kubectl rollout status deployment/search-service -n forkcast --timeout=300s
            kubectl rollout status deployment/notification-service -n forkcast --timeout=300s
            kubectl rollout status deployment/upload-service -n forkcast --timeout=300s
            kubectl rollout status deployment/api-gateway -n forkcast --timeout=300s

            # Show final status
            echo "✅ Local Kubernetes deployment completed!"
            echo ""
            echo "📊 Current cluster status:"
            kubectl get pods -n forkcast -o wide

            echo ""
            echo "🌐 Services accessible at:"
            echo "API Gateway: http://$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="ExternalIP")].address}'):30001"
            echo "           : http://localhost:30001 (if using port forwarding)"

            echo ""
            echo "🎉 Local Kubernetes deployment complete!"
